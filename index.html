let S;try{S=JSON.parse(localStorage.getItem("recomp")||"null")}catch(e){S=null}
S=S||{};S.d=S.d||{};S.kcal=S.kcal||2400;S.prot=S.prot||180;
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
if(!S.start){const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);S.start=iso(d)}
const save=()=>{try{localStorage.setItem("recomp",JSON.stringify(S))}catch(e){}};

const isDone=(w,i)=>!!(S.d[key(w,i)]&&S.d[key(w,i)].done);
function prev(id){const cv=vAt(wk,id);for(let w=wk-1;w>=1;w--){if(vAt(w,id)!==cv)continue;const x=(S.d[key(w,dy)]||{ex:{}}).ex[id];if(!x)continue;const s=(x.sets||[]).filter(t=>t&&t.kg);if(s.length)return s;if(x.kg)return[{kg:x.kg,reps:x.reps}]}return null}
const VAR={
